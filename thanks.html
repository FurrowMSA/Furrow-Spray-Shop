/* ============================================================
   Furrow — Colour system
   ------------------------------------------------------------
   A field palette: charcoal "iron", Furrow green "paddock", and
   one warm focal "harvest" orange used sparingly (≤10% of any
   view). Charcoal + white are free; green carries structure and
   secondary action; harvest orange is THE one focal item.
   Base values first, then semantic aliases — reach for the
   aliases (--text-body, --surface-card) in components.
   ============================================================ */
:root {
  /* ---- Foundation ---- */
  --iron:    #2B2B2B; /* charcoal field — dark bands, footer, hero scrim base */
  --paddock: #64A439; /* Furrow green — brand structure, links, secondary action */
  --crop:    #408732; /* dark green — hover/active, on-light green text */
  --leaf:    #8FC963; /* light green — highlights on dark, data peaks */

  /* Iron tints (dark UI depth) */
  --iron-1: #3C3C3C;
  --iron-2: #565656;
  --iron-3: #7E7E7E;
  --iron-4: #B4B4B2;

  /* Paddock tints */
  --paddock-1: #7DB558;
  --paddock-2: #97C578;
  --paddock-3: #B8D8A2;
  --paddock-4: #DDEBD1;

  /* Deep charcoal anchors (hero scrims, deep bands) */
  --iron-lift:  #3A3A38;
  --iron-deep:  #1A1A1A;
  --iron-black: #0F0F0E;

  /* ---- Focal warm — the spark (≤10%) ---- */
  --harvest: #F1901C; /* THE focal device — highlight capsule, the one CTA, keylines */
  --wheat:   #F8C367; /* soft warm — rare, warm pairing */
  --stubble: #F5F3EE; /* warm light background — the branded "white" */

  /* Harvest tints */
  --harvest-1: #F4A548;
  --harvest-2: #F7BA74;
  --harvest-3: #FACFA0;
  --harvest-4: #FCE7CE;

  /* ---- Neutrals ---- */
  --soil:   #232323; /* near-black — body ink on light */
  --gravel: #6E7069; /* warm grey — captions, secondary text, rules */
  --white:  #FFFFFF;

  /* Gravel tints */
  --gravel-1: #8B8D86;
  --gravel-2: #ABACA6;
  --gravel-3: #CDCEC9;
  --gravel-4: #E9E9E6;

  /* ============================================================
     Semantic aliases — reach for these in components.
     ============================================================ */
  --surface-hero:       var(--iron);
  --surface-dark:       var(--iron);
  --surface-dark-lift:  #343433;
  --surface-light:      var(--stubble);
  --surface-paper:      var(--white);
  --surface-card-dark:  #383837;
  --surface-card-light: var(--white);

  --text-on-dark:       var(--white);
  --text-on-dark-muted: #C2C3BF;
  --text-on-dark-faint: #8F908B;

  --text-body:    var(--soil);
  --text-muted:   var(--gravel);
  --text-heading: var(--iron);

  --action:        var(--paddock);
  --action-hover:  #74B447;
  --action-active: var(--crop);
  --link:          var(--crop);
  --focus-ring:    var(--paddock);

  /* ---- Action hierarchy (the colour budget) ----
     Charcoal + white are free; green carries structure and
     secondary actions; harvest orange is THE one focal item per view. */
  --action-primary:   var(--harvest);  /* the one CTA per view */
  --action-secondary: var(--paddock);  /* persistent + secondary buttons, links */
  --action-tertiary:  transparent;     /* outline / ghost */

  --accent:      var(--harvest);
  --accent-soft: var(--wheat);

  --border-on-dark:  rgba(255,255,255,0.14);
  --border-on-light: #DEDCD4;
  --rule-green:      var(--paddock);
  --divider:         var(--gravel);

  --status-info:    var(--paddock);
  --status-success: #3E8E4E;
  --status-warning: var(--harvest);
  --status-danger:  #C64B33;

  /* ---- Hazard — SAFETY SEMANTICS ONLY ----
     Kept outside the brand palette and OFF the harvest role.
     Chemical-handling warnings, run-dry alarms, e-stop states. */
  --hazard:      #C64B33;
  --hazard-deep: #99351F;
  --hazard-soft: #F2D4CC;
}

/* ============================================================
   Furrow — Typography tokens
   ------------------------------------------------------------
   Barlow (display) for headlines, big numbers and labels — set
   solid and plain-spoken, mostly UPPERCASE for H1/H2, sentence
   case elsewhere. Open Sans for body/UI. No other families.
   ============================================================ */
:root {
  --font-display: 'Barlow', 'Open Sans', system-ui, sans-serif;
  --font-body:    'Open Sans', system-ui, -apple-system, sans-serif;
  --font-mono:    ui-monospace, 'SFMono-Regular', Menlo, monospace;

  --w-regular:  400; /* @kind font */
  --w-medium:   500; /* @kind font */
  --w-semibold: 600; /* @kind font */
  --w-bold:     700; /* @kind font */
  --w-heavy:    800; /* @kind font */

  /* Display scale (Barlow) */
  --d-hero: clamp(2.75rem, 5vw, 4.25rem); /* @kind font */
  --d-1: 3rem;     /* 48 */
  --d-2: 2.25rem;  /* 36 */
  --d-3: 1.75rem;  /* 28 */
  --d-4: 1.375rem; /* 22 */

  /* Body scale (Open Sans) */
  --t-lead: 1.25rem;  /* 20 — standfirst */
  --t-lg:   1.125rem; /* 18 */
  --t-base: 1rem;     /* 16 */
  --t-sm:   0.875rem; /* 14 */
  --t-xs:   0.75rem;  /* 12 */

  --t-eyebrow: 0.8125rem; /* 13 */

  --lh-display: 1.08; /* @kind font */
  --lh-tight:   1.15; /* @kind font */
  --lh-snug:    1.35; /* @kind font */
  --lh-body:    1.65; /* @kind font */
  --lh-loose:   1.8;  /* @kind font */

  --ls-display: -0.01em; /* @kind font */
  --ls-tight:   0;       /* @kind font */
  --ls-normal:  0;       /* @kind font */
  --ls-eyebrow: 0.18em;  /* @kind font */
  --ls-label:   0.1em;   /* @kind font */
}

/* ============================================================
   Furrow — Spacing, radii & layout
   ------------------------------------------------------------
   8px grid. Corners are square-shouldered and practical —
   barely rounded, workshop-tough. The 3px keyline bar is the
   signature border weight.
   ============================================================ */
:root {
  --s-0: 0;         /* @kind spacing */
  --s-1: 0.25rem;   /* 4 */
  --s-2: 0.5rem;    /* 8 */
  --s-3: 0.75rem;   /* 12 */
  --s-4: 1rem;      /* 16 */
  --s-5: 1.5rem;    /* 24 */
  --s-6: 2rem;      /* 32 */
  --s-7: 3rem;      /* 48 */
  --s-8: 4rem;      /* 64 */
  --s-9: 6rem;      /* 96 */
  --s-10: 8rem;     /* 128 */

  /* Radii — squarer than most; workshop-tough */
  --r-none: 0;      /* @kind radius */
  --r-sm: 3px;      /* chips, inputs */
  --r-md: 4px;      /* buttons, small cards */
  --r-lg: 8px;      /* panels / media */
  --r-pill: 999px;  /* pills, tags */
  --r-circle: 50%;  /* @kind radius */

  --bw-hair: 1px;   /* @kind other */
  --bw: 1.5px;      /* @kind other */
  --bw-thick: 3px;  /* @kind other */ /* the keyline bar */

  --container: 1140px;      /* @kind other */
  --container-wide: 1400px; /* @kind other */
  --container-doc: 760px;   /* @kind other */
  --gutter: 2rem;           /* @kind spacing */
  --section-y: 5.5rem;      /* @kind spacing */
}

/* ============================================================
   Furrow — Effects: scrims, fields, shadows, furrow-line texture,
   motion.
   ------------------------------------------------------------
   The brand signature is a full-bleed paddock/machinery photo
   under a charcoal scrim, with one orange focal element. Scrims
   are never flat black — they wash toward deep charcoal. Shadows
   are soft and warm-neutral, never heavy. The faint parallel
   "furrow lines" texture (5–10% white) sits over dark fields.
   Motion is practical and quick — no theatrics, no bounce.
   ============================================================ */
:root {
  /* Hero field — charcoal wash used OVER photography */
  --hero-scrim: linear-gradient(90deg, rgba(15,15,14,0.82) 0%, rgba(15,15,14,0.55) 45%, rgba(15,15,14,0.18) 100%); /* @kind other */
  --hero-scrim-bottom: linear-gradient(0deg, rgba(15,15,14,0.85) 0%, rgba(15,15,14,0.35) 45%, rgba(15,15,14,0) 100%); /* @kind other */

  /* Solid dark field when there is no photo */
  --field-dark: linear-gradient(180deg, #343433 0%, var(--iron) 60%, #222221 100%); /* @kind other */
  --field-light: var(--stubble); /* @kind color */

  /* Scrims / protection gradients (never flat black) */
  --scrim-bottom: linear-gradient(0deg, rgba(15,15,14,0.85) 0%, rgba(15,15,14,0.35) 45%, rgba(15,15,14,0) 100%); /* @kind other */
  --scrim-top: linear-gradient(180deg, rgba(15,15,14,0.75) 0%, rgba(15,15,14,0) 100%); /* @kind other */
  --scrim-left: linear-gradient(90deg, rgba(15,15,14,0.8) 0%, rgba(15,15,14,0) 70%); /* @kind other */

  /* Shadows — soft, warm-neutral; never heavy */
  --shadow-sm: 0 1px 2px rgba(35,35,35,0.10);
  --shadow-md: 0 6px 18px rgba(35,35,35,0.12);
  --shadow-lg: 0 16px 40px rgba(35,35,35,0.16);
  --shadow-dark: 0 16px 40px rgba(0,0,0,0.45);

  /* Focal edge — orange keyline instead of glow */
  --edge-harvest: inset 3px 0 0 var(--harvest);
  --edge-paddock: inset 3px 0 0 var(--paddock);

  /* Furrow-lines texture — faint parallel seeding lines over dark fields, 5–10% opacity */
  --furrow-color: rgba(255,255,255,0.05);
  --furrow-size: 18px; /* @kind spacing */
  --furrow-lines: repeating-linear-gradient(0deg, var(--furrow-color) 0 1px, transparent 1px 18px); /* @kind other */

  /* Motion — practical, quick, no theatrics */
  --ease-standard: cubic-bezier(0.25, 0.6, 0.35, 1); /* @kind other */
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1); /* @kind other */
  --dur-fast: 140ms; /* @kind other */
  --dur-base: 220ms; /* @kind other */
  --dur-slow: 420ms; /* @kind other */
}

/* ============================================================
   Furrow — Base element defaults + brand device utilities.
   ------------------------------------------------------------
   Consumers get sensible element defaults (display type on
   headings, uppercase H1/H2, readable body) plus the four brand
   devices: the orange HIGHLIGHT capsule, the 3px orange KEYLINE
   label, the small-caps EYEBROW, and the faint FURROW-LINES
   overlay for dark fields.
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  font-family: var(--font-body);
  font-size: var(--t-base);
  line-height: var(--lh-body);
  color: var(--text-body);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

h1, h2, h3, h4 {
  font-family: var(--font-display);
  font-weight: var(--w-bold);
  line-height: var(--lh-display);
  letter-spacing: var(--ls-display);
  color: var(--text-heading);
  margin: 0 0 0.4em;
  text-wrap: balance;
}
h1 { font-size: var(--d-1); text-transform: uppercase; }
h2 { font-size: var(--d-2); text-transform: uppercase; }
h3 { font-size: var(--d-3); }
h4 { font-size: var(--d-4); }

p { margin: 0 0 1em; text-wrap: pretty; }

a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 3px; }
strong { font-weight: var(--w-bold); }
::selection { background: var(--paddock); color: #fff; }

/* ---- Brand device utilities ---- */

/* Orange HIGHLIGHT capsule — the signature: "Designed to Keep You Working." */
.fw-highlight {
  background: var(--harvest);
  color: #fff;
  font-style: italic;
  font-weight: var(--w-semibold);
  padding: 0.1em 0.45em;
  box-decoration-break: clone;
  -webkit-box-decoration-break: clone;
}

/* KEYLINE label — small uppercase label with the 3px orange bar (hero chips) */
.fw-keyline {
  font-family: var(--font-display);
  font-weight: var(--w-semibold);
  font-size: var(--t-eyebrow);
  letter-spacing: var(--ls-label);
  text-transform: uppercase;
  border-left: var(--bw-thick) solid var(--harvest);
  padding-left: 0.7em;
  color: inherit;
}

/* small-caps eyebrow */
.fw-eyebrow {
  font-family: var(--font-body);
  font-weight: var(--w-semibold);
  font-size: var(--t-eyebrow);
  letter-spacing: var(--ls-eyebrow);
  text-transform: uppercase;
  color: var(--paddock);
}

/* dark hero field (no photo) */
.fw-hero-bg { background: var(--field-dark); color: var(--text-on-dark); }

/* furrow-lines overlay (layer on a dark block) */
.fw-furrows {
  background-image: var(--furrow-lines);
  background-size: var(--furrow-size) var(--furrow-size);
}

/* ---- Interaction states (hover = darker, press = slight settle) ---- */
.fw-btn--primary:not(:disabled):hover { background: var(--action-hover) !important; }
.fw-btn--cta:not(:disabled):hover { background: var(--harvest-1) !important; }
.fw-btn--secondary:not(.fw-btn--ondark):not(:disabled):hover { background: rgba(100,164,57,0.08) !important; }
.fw-btn--secondary.fw-btn--ondark:not(:disabled):hover { background: rgba(255,255,255,0.10) !important; }
.fw-btn--ghost:not(:disabled):hover { text-decoration: underline; text-underline-offset: 3px; }
.fw-btn:not(:disabled):active { transform: translateY(1px); }

.fw-card--interactive { cursor: pointer; }
.fw-card--interactive:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg) !important; }

  html { scroll-behavior: smooth; scroll-padding-top: 72px; }
  body { margin: 0; background: #fff; }
  a.ss-navlink { transition: color var(--dur-fast) var(--ease-standard); }
  a.ss-navlink:hover { color: var(--leaf) !important; }
  
  
  .ss-nozzle-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .ss-nozzle-tile { transition: border-color var(--dur-fast) var(--ease-standard), transform var(--dur-fast) var(--ease-standard), box-shadow var(--dur-fast) var(--ease-standard); }
  .ss-nozzle-tile:hover { border-color: var(--paddock) !important; transform: translateY(-2px); box-shadow: var(--shadow-2, 0 6px 18px rgba(0,0,0,0.08)); }
  @media (max-width: 900px) { .ss-nozzle-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 560px) { .ss-nozzle-grid { grid-template-columns: 1fr; } }

/* --- mobile nav: the section links collapse; the footer's "On this page"
       list carries them on small screens --- */
@media (max-width: 900px) {
  .ss-navlinks .ss-navlink { display: none; }

@media (max-width: 420px) {

}

/* --- responsive grids: the design sets these column counts inline, so they
       need !important to be overridden at narrow widths --- */
@media (max-width: 900px) {
  [style*="grid-template-columns: 1.05fr 1fr"],
  [style*="grid-template-columns: 1fr 1.35fr"],
  [style*="grid-template-columns: 1fr 1.1fr"],
  [style*="grid-template-columns: 1.7fr 1fr 1fr"] {
    grid-template-columns: 1fr !important;
    gap: 32px !important;
  }
  [style*="grid-template-columns: repeat(4, 1fr)"] { grid-template-columns: repeat(2, 1fr) !important; }
}
@media (max-width: 620px) {
  [style*="grid-template-columns: 1fr 1fr"] { grid-template-columns: 1fr !important; }
  [style*="grid-template-columns: repeat(4, 1fr)"] { grid-template-columns: 1fr !important; }
}
</style>
